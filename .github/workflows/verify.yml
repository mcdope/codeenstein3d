name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (no browser)
    runs-on: ubuntu-latest
    # verify:wad-parser and verify:campaign are pure Node (parser + map
    # generator via esbuild, no browser at all) — skip Playwright's browser
    # download, which `npm ci` would otherwise trigger for nothing.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `build`'s own `prebuild` hook fetches the online WAD catalog
      # (~170 MB, see onlineWadCatalog.ts) if not already present — cached
      # the same way the Playwright browser binary below is, so a normal run
      # restores from cache instead of re-downloading from 3 external hosts.
      - name: Cache online WAD assets
        uses: actions/cache@v6
        with:
          path: public/wads
          key: online-wads-${{ hashFiles('src/wad/onlineWadCatalog.ts') }}
      # The fetcher itself warns-and-continues by default, so that a clone
      # with no network can still run `npm run dev`/`npm run build` (the
      # packs are optional; the game ships procedural textures). CI is the
      # one place that *should* fail on a catalog entry that has gone 404 or
      # started serving something unparseable — hence `--strict` here,
      # ahead of the `prebuild` hook, which then finds everything present
      # and skips it.
      - run: npm run fetch:online-wads -- --strict
      # `build` chains `tsc --noEmit && vite build`, so this is the one CI
      # step that catches a type error or a Vite build break before it lands
      # on master — the other jobs run Vitest (transpiles via esbuild, no
      # type-check) or a dev server (also no type-check/build).
      - run: npm run build
      - run: npm run verify:wad-parser
      - run: npm run verify:zip-reader
      - run: npm run verify:campaign
      - run: npm run verify:multiplayer-server

  test:
    # Thresholds live in vitest.config.ts and are deliberately not repeated here —
    # a number in a job name is a mirror with no link. They are currently
    # 99.9/99.9/99.5/99.5, not 100%; see that file for why.
    name: unit tests (Vitest, coverage gate)
    runs-on: ubuntu-latest
    # Vitest/jsdom, no real browser at all — same reasoning as the `verify`
    # job above.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A handful of individual tests already carry their own per-test retry
      # budget for genuine, documented gameplay/timing variance (seeded-AI
      # combat, real event-loop races) — this is a second, coarser layer on
      # top of that: retry the *whole* run once if it still fails, since a
      # loaded CI runner can occasionally push a normally-comfortable retry
      # budget past its limit in a way a local run never does.
      - name: Run test suite with coverage (retry once on failure)
        run: npm run coverage || npm run coverage

  verify-browser:
    name: verify (Playwright/${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Playwright's own image: all three browsers and every OS library already
    # baked in, so neither `playwright install` nor — the point of this —
    # `playwright install-deps`, which is an apt-get against Azure's mirrors.
    # That step ran 7x per workflow at 210-442s total, and its variance was the
    # real problem rather than its mean: the same firefox leg measured 18s and
    # 283s on two consecutive green runs, and it intermittently hung.
    #
    # The tag must move in lockstep with the `playwright` npm package, since the
    # image bakes in specific browser builds; `scripts/assert-browsers-present.mjs`
    # is the guard, and its header explains the coupling.
    #
    # `--user 1001` (pwuser) rather than the default root: Chromium's sandbox
    # cannot start as root under the runner's default seccomp profile. This is
    # the combination Playwright documents for GitHub Actions.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        # Neither script touches `window.showDirectoryPicker`'s real,
        # genuinely Chromium-only native picker dialog (one stubs it via
        # OPFS, the other never calls it at all) — see
        # `scripts/lib/browserEngine.mjs`'s doc comment. But WebKit's own
        # Playwright build has no `navigator.storage` at all (confirmed
        # directly, not assumed — a Playwright/Linux-WebKit build gap, not a
        # real Safari limitation), so the OPFS stub itself is unusable there;
        # `verify:campaign:playthrough` is skipped for webkit below, see
        # doc/dev/testing.md's cross-browser section. Separately,
        # `verify:multiplayer-connect`/`verify:multiplayer-netcode`/
        # `verify:multiplayer-reconciliation`/`verify:multiplayer-disconnect`
        # are skipped for firefox below — a real, Mozilla-acknowledged
        # (WONTFIX) WebRTC ICE-gathering limitation specific to this
        # sandboxed runner's network shape, not a Playwright-build gap or an
        # app bug — see those steps' own comments and doc/dev/testing.md.
        # `verify:multiplayer-determinism` (step 10, cross-browser float
        # determinism) runs in its own dedicated `verify-determinism` job
        # below, not this matrix — it needs all three engines in one job.
        # `verify:multiplayer-transition`/`verify:multiplayer-multiguest`
        # (the two genuinely slow, multi-minute real-session steps) also run
        # in their own dedicated jobs below, not this matrix — chromium-only
        # either way (same ICE-gathering/webkit-timing reasoning that used to
        # live here), pulled out so their real wall-clock cost no longer
        # stacks up against every other step in this job's chromium leg.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browsers come from the container image, not a download
        run: node scripts/assert-browsers-present.mjs ${{ matrix.browser }}
      # `npm run dev`'s own `predev` hook fetches the online WAD catalog if
      # not already present — same cache as the `verify` job above, shared
      # across this matrix's legs by key (not by job), so at most one leg
      # actually re-downloads on a cache miss.
      - name: Cache online WAD assets
        uses: actions/cache@v6
        with:
          path: public/wads
          key: online-wads-${{ hashFiles('src/wad/onlineWadCatalog.ts') }}
      # Started before the dev server, not after: Vite inlines `VITE_*` env
      # vars at server-*start* time, not per-request, so the dev server below
      # must already see `VITE_MULTIPLAYER_SERVER_URL` pointed at a live
      # signaling server when it boots.
      - name: Start multiplayer signaling server
        run: |
          node scripts/multiplayer-server.mjs &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8787/lobby && break
            sleep 1
          done
        env:
          CODEENSTEIN_MULTIPLAYER_ALLOWED_ORIGIN: "http://localhost:5173"
      - name: Start dev server
        run: |
          npm run dev -- --port 5173 --strictPort &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
        env:
          VITE_MULTIPLAYER_SERVER_URL: "http://127.0.0.1:8787"
      - run: npm run verify:wad-textures
        env:
          CODEENSTEIN_VERIFY_BROWSER: ${{ matrix.browser }}
      # Skipped for webkit — see the matrix comment above.
      - run: npm run verify:campaign:playthrough
        if: matrix.browser != 'webkit'
        env:
          CODEENSTEIN_DEV_URL: "http://localhost:5173"
          CODEENSTEIN_VERIFY_BROWSER: ${{ matrix.browser }}
      # Runs on chromium/webkit, not the full matrix — unlike
      # verify:campaign:playthrough above, it doesn't touch OPFS/
      # `showDirectoryPicker`, so WebKit's `navigator.storage` gap doesn't
      # apply here; but Firefox specifically has a confirmed, real WebRTC
      # ICE-gathering limitation in this exact sandboxed-container network
      # shape (no internet-routable default route for Firefox's own
      # interface-discovery heuristic to find — a genuine Mozilla WONTFIX,
      # not something app code can work around) — see
      # scripts/verify-multiplayer-connect.mjs's own doc comment and
      # doc/dev/testing.md's cross-browser section for the full
      # investigation.
      - run: npm run verify:multiplayer-connect
        if: matrix.browser != 'firefox'
        env:
          CODEENSTEIN_DEV_URL: "http://localhost:5173"
          CODEENSTEIN_VERIFY_BROWSER: ${{ matrix.browser }}
      # Same CI-only WebRTC ICE-gathering limitation as verify:multiplayer-connect
      # above (not a new one) — see that step's own comment.
      - run: npm run verify:multiplayer-netcode
        if: matrix.browser != 'firefox'
        env:
          CODEENSTEIN_DEV_URL: "http://localhost:5173"
          CODEENSTEIN_VERIFY_BROWSER: ${{ matrix.browser }}
      # Same CI-only WebRTC ICE-gathering limitation as verify:multiplayer-connect
      # above (not a new one) — see that step's own comment.
      - run: npm run verify:multiplayer-reconciliation
        if: matrix.browser != 'firefox'
        env:
          CODEENSTEIN_DEV_URL: "http://localhost:5173"
          CODEENSTEIN_VERIFY_BROWSER: ${{ matrix.browser }}
      # Same CI-only WebRTC ICE-gathering limitation as verify:multiplayer-connect
      # above (not a new one) — see that step's own comment.
      - run: npm run verify:multiplayer-disconnect
        if: matrix.browser != 'firefox'
        env:
          CODEENSTEIN_DEV_URL: "http://localhost:5173"
          CODEENSTEIN_VERIFY_BROWSER: ${{ matrix.browser }}

  # verify:multiplayer-transition is the real multi-minute step (a full real
  # host-navigates-to-exit-and-transitions multiplayer session) — split into
  # its own job, not a leg of verify-browser's matrix above, specifically so
  # its wall-clock cost runs concurrently with everything else instead of
  # stacking onto the end of a shared chromium leg. Chromium-only: firefox
  # has a confirmed, Mozilla-acknowledged (WONTFIX) WebRTC ICE-gathering
  # limitation specific to this sandboxed runner's network shape (see
  # scripts/verify-multiplayer-connect.mjs's own doc comment); webkit is
  # skipped for real, previously-confirmed combat/navigation-timing variance
  # under webkit's own CI execution characteristics (see
  # doc/dev/testing.md's cross-browser section) — reasoned before the host
  # was made invulnerable/combat-avoidant, worth re-checking separately from
  # this job-structure change, not as part of it.
  #
  # BLOCKING again (2026-08-03), after 10 consecutive green runs on this job.
  #
  # It was made non-blocking on 2026-08-01 on the theory that its `host got
  # stuck on the final approach to the exit` failure was the bot's luck, since
  # the gameplay seed is `randomSeed()`. That was wrong, and the disproof was
  # already in every log: the stall coordinates repeat across runs with
  # *different* seeds, because demo-campaign level 1's layout is deterministic.
  #
  # It was six separate bugs, none of them variance — full write-up in
  # doc/dev/history.md. Briefly: `driveLegs` dropped `reason` on a stuck route
  # so every route failure was misreported as a final-approach one; the final
  # approach was a straight line that could not clear the enemy `checkExit()
  # gates the exit on; `MultiplayerBot`'s loot detour had drifted from the
  # single-player one it was forked from; a *completed* level transition read
  # as a teleporter and was reported as a failure; the blocker hunt could pass
  # all six rounds without executing a single decision when the blocker was
  # already adjacent; and a wedged route was treated as terminal when
  # `driveToExit` can re-path from wherever the legs died.
  #
  # Measured, not assumed, at each step: 4 consecutive master failures ->
  # 1/5 -> 4/5 -> 6/6 -> 10/10.
  #
  # If it fails again, treat it as a real signal. Anomalies now name the errand
  # they happened on, failures dump the exit gate (host position, live vs
  # planned roster, which enemies are exit-room and whether they are alive),
  # and CODEENSTEIN_TRANSITION_CLEAR_EXIT_ROOM=1 rules the exit gate in or out
  # in a single run. `scripts/diagnose-level-wedge.mjs --mp-shape` reproduces
  # the navigation locally without needing WebRTC — but note it runs on the
  # virtual clock, so it cannot see anything that depends on the real transport
  # delay or on the transition itself. Three of the six bugs above were
  # invisible to it.
  # Replays a shipped highscore entry and asserts it reproduces the run it
  # recorded, frame for frame. Its own job so its wall clock runs concurrently
  # with the rest, and chromium-only on purpose: transcendental math is not
  # bit-identical across browser engines (that is what
  # verify:multiplayer-determinism measures), so a firefox/webkit leg here
  # would be testing float behaviour rather than replay fidelity and a failure
  # would be unattributable. See scripts/verify-replay.mjs's doc comment.
  #
  # A PR checks the first 3 levels of one entry; master checks all three
  # entries end to end, including the 5x Pro one — 51 segments, 186,430
  # recorded frames, 450 checks, measured at 360s locally at concurrency 3.
  verify-replay:
    name: verify (replay)
    runs-on: ubuntu-latest
    # Playwright's image — see `verify-browser` above for the reasoning.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    # Full board is ~186k advance() calls of real simulate+render; SwiftShader
    # on a CI runner has no GPU, so budget several times the local figure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browsers come from the container image, not a download
        run: node scripts/assert-browsers-present.mjs chromium
      - name: Cache online WAD assets
        uses: actions/cache@v6
        with:
          path: public/wads
          key: online-wads-${{ hashFiles('src/wad/onlineWadCatalog.ts') }}
      - name: Start dev server
        run: |
          npm run dev -- --port 5173 --strictPort &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
      - run: npm run verify:replay
        env:
          CODEENSTEIN_DEV_URL: "http://localhost:5173"
          CODEENSTEIN_VERIFY_BROWSER: chromium
          CODEENSTEIN_REPLAY_ENTRIES: ${{ github.event_name == 'pull_request' && '0' || 'all' }}
          CODEENSTEIN_REPLAY_LEVEL_LIMIT: ${{ github.event_name == 'pull_request' && '3' || '' }}
          CODEENSTEIN_REPLAY_CONCURRENCY: 3

  verify-multiplayer-transition:
    name: verify (multiplayer-transition)
    runs-on: ubuntu-latest
    # Playwright's image — see `verify-browser` above for the reasoning.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    # A wedge used to be able to outlast the job it ran in (one waypoint could
    # burn 240 real seconds, times four re-plans). The budgets are bounded now,
    # so anything past this is a new failure mode and should fail fast rather
    # than sit against GitHub's 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browsers come from the container image, not a download
        run: node scripts/assert-browsers-present.mjs chromium
      - name: Cache online WAD assets
        uses: actions/cache@v6
        with:
          path: public/wads
          key: online-wads-${{ hashFiles('src/wad/onlineWadCatalog.ts') }}
      - name: Start multiplayer signaling server
        run: |
          node scripts/multiplayer-server.mjs &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8787/lobby && break
            sleep 1
          done
        env:
          CODEENSTEIN_MULTIPLAYER_ALLOWED_ORIGIN: "http://localhost:5173"
      - name: Start dev server
        run: |
          npm run dev -- --port 5173 --strictPort &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
        env:
          VITE_MULTIPLAYER_SERVER_URL: "http://127.0.0.1:8787"
      - run: npm run verify:multiplayer-transition
        env:
          CODEENSTEIN_DEV_URL: "http://localhost:5173"
          CODEENSTEIN_VERIFY_BROWSER: chromium

  # Step 10 (N-player): real 1-host/2-guest session — auto-rearm join, 3-way
  # lockstep, Elite scaling at playerCount=3, per-guest disconnect isolation.
  # Same rationale as verify-multiplayer-transition above for its own
  # dedicated job (the other genuinely slow, multi-minute step) and for
  # being chromium-only: firefox's confirmed ICE-gathering WONTFIX, plus a
  # separately-confirmed webkit-only timing variance (guest-2's join racing
  # the real auto-rearm cycle exhausted a 9-attempt/~40s retry budget on
  # CI's webkit runner specifically, while passing reliably on local webkit
  # and on CI's own chromium leg) — see doc/dev/testing.md's cross-browser
  # section.
  verify-multiplayer-multiguest:
    name: verify (multiplayer-multiguest)
    runs-on: ubuntu-latest
    # Playwright's image — see `verify-browser` above for the reasoning.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browsers come from the container image, not a download
        run: node scripts/assert-browsers-present.mjs chromium
      - name: Cache online WAD assets
        uses: actions/cache@v6
        with:
          path: public/wads
          key: online-wads-${{ hashFiles('src/wad/onlineWadCatalog.ts') }}
      - name: Start multiplayer signaling server
        run: |
          node scripts/multiplayer-server.mjs &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8787/lobby && break
            sleep 1
          done
        env:
          CODEENSTEIN_MULTIPLAYER_ALLOWED_ORIGIN: "http://localhost:5173"
      - name: Start dev server
        run: |
          npm run dev -- --port 5173 --strictPort &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
        env:
          VITE_MULTIPLAYER_SERVER_URL: "http://127.0.0.1:8787"
      - run: npm run verify:multiplayer-multiguest
        env:
          CODEENSTEIN_DEV_URL: "http://localhost:5173"
          CODEENSTEIN_VERIFY_BROWSER: chromium

  # Step 10: cross-browser floating-point determinism check
  # (scripts/verify-multiplayer-determinism.mjs). Unlike verify-browser above,
  # this needs all three Playwright engines installed in the SAME job (it
  # diffs their outputs against each other and a Node reference) rather than
  # one engine per matrix leg — and it never opens WebRTC (each engine just
  # runs an identical synthetic seeded-math loop independently), so Firefox's
  # confirmed CI-only WebRTC ICE-gathering limitation doesn't apply here; all
  # three run together, no skips needed.
  verify-determinism:
    name: verify (cross-browser determinism)
    runs-on: ubuntu-latest
    # Playwright's image — see `verify-browser` above for the reasoning.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browsers come from the container image, not a download
        run: node scripts/assert-browsers-present.mjs chromium firefox webkit
      - run: npm run verify:multiplayer-determinism
