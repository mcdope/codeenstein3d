name: Secret scan

# Deliberately a separate workflow from verify.yml: it needs the `edited`
# pull_request type so that editing a PR *description* re-scans it, and adding
# `edited` to verify.yml would re-run the whole browser matrix every time
# someone fixes a typo in a description.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: secret scan (tree + PR description)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No `npm ci` — the scanner is dependency-free on purpose, so this job
      # stays under ~20s and cannot be skipped for being slow.

      - name: Scan tracked files
        env:
          # Optional repo secret holding the same values as the gitignored
          # ssh-hosts.env / docker/.env, newline-separated. Without it the job
          # still runs the structural rules; with it, exact matching works in
          # CI too. Actions masks the value in logs.
          SECRET_SCAN_DENYLIST: ${{ secrets.SECRET_SCAN_DENYLIST }}
        run: node scripts/check-secrets.mjs --tree

      # The 2026-08-23 incident leaked a second time through the PR description
      # of the PR that removed the values from the files. That channel gets the
      # same gate.
      - name: Scan pull request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SECRET_SCAN_DENYLIST: ${{ secrets.SECRET_SCAN_DENYLIST }}
        run: |
          # Via env, never inlined into the script: a description is attacker-
          # controlled text, and interpolating an expression straight into the
          # shell would be an injection. Note the comment cannot *show* that
          # interpolation syntax: the expression parser reads a run block whole,
          # comments included, and an empty one fails the file to parse.
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > /tmp/pr-body.txt
          node scripts/check-secrets.mjs --text /tmp/pr-body.txt
